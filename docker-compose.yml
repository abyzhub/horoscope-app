version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: horoscope_db
    environment:
      POSTGRES_USER: horoscope
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: horoscope
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
